name: Rebuild institutional site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace site source
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch \
            index.html 404.html README.md CHANGELOG.md favicon.svg vercel.json robots.txt media.js \
            assets empresa equipe solucoes operacao contato cotacao trabalhe-conosco privacidade docs

          cat > /tmp/site.tar.gz.b64 <<'BUNDLE'
[... ELLIPSIZATION ...]
BUNDLE
          base64 -d /tmp/site.tar.gz.b64 > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C .

          if grep -RniE 'lovable|generated project|@lovable' . --exclude-dir=.git --exclude='rebuild-site.yml'; then
            echo 'Forbidden builder reference detected.' >&2
            exit 1
          fi

          node --check assets/site.js
          test -f assets/brand/logo.svg
          test -f empresa/index.html
          test -f equipe/index.html
          test -f cotacao/index.html
          test -f contato/index.html
          grep -q 'Matheus Ferreira' index.html
          grep -q 'data-live-form="quote"' cotacao/index.html
          grep -q 'data-live-form="contact"' contato/index.html

      - name: Commit rebuilt site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Matheus Ferreira'
          git config user.email 'matheusfrafou@gmail.com'
          git add -A
          git reset -- .github/workflows/rebuild-site.yml
          if git diff --cached --quiet; then
            echo 'No site changes to commit.'
            exit 0
          fi
          git commit -m 'feat: reconstrói site institucional completo'
          git push
