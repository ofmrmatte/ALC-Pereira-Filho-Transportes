name: Validate institutional site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f README.md
          test -f vercel.json
          test -f favicon.svg

      - name: Validate institutional metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ALC & Pereira Filho Transportes' index.html
          grep -q 'Matheus Ferreira' index.html
          grep -q 'Matheus Ferreira' README.md
          grep -q 'X-Robots-Tag' vercel.json

      - name: Validate preview content
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Movemos negócios' index.html
          grep -q 'Solicitar cotação' index.html
          grep -q 'Mídia provisória de homologação' index.html
